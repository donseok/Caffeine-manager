<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섭취 기록 — 카페인 매니저</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="popup-page">
<div class="popup" id="popup">
  <div class="popup__head">
    <div><p class="popup__kicker">섭취 기록</p><h2 class="popup__title" id="title">불러오는 중…</h2></div>
    <button type="button" class="popup__close" aria-label="닫기" data-close>×</button>
  </div>

  <div class="popup__product" id="productBox">
    <div class="popup__thumb" id="thumb"></div>
    <div><strong id="productLine">—</strong><span id="nutritionLine">—</span></div>
  </div>

  <form id="form" novalidate>
    <div class="form-grid">
      <label class="field">
        <span class="field__label">마신 횟수</span>
        <input type="number" id="quantity" value="1" min="0.1" max="20" step="0.1" inputmode="decimal" required>
        <small class="field__hint">한 번에 절반만 마셨다면 0.5</small>
      </label>
      <label class="field">
        <span class="field__label">마신 날짜와 시간</span>
        <input type="datetime-local" id="consumedAt" required>
        <small class="field__hint">통계와 잔존 카페인 추정에 사용</small>
      </label>
      <label class="field span-2">
        <span class="field__label">1회 실제 결제액 <em>(선택)</em></span>
        <div class="field--suffix"><input type="number" id="pricePaid" placeholder="예: 4700" min="0" step="10" inputmode="numeric"><b>원</b></div>
        <small class="field__hint" id="priceHint">입력하면 다음 검색부터 ‘내 최근 결제 가격’으로 표시됩니다.</small>
      </label>
    </div>

    <div class="summary" id="summary">—</div>
    <div class="form-error hidden" id="error"></div>

    <div class="popup__actions">
      <button type="button" class="btn-ghost" data-close>취소</button>
      <button type="submit" class="btn-green" id="saveBtn">기록 저장</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/seed-products.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/record.js"></script>
</body>
</html>
