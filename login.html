<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 카페인 매니저</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231F6F5B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
  <section class="auth__card">
    <div class="auth__brand"><span class="brand__dot"></span><strong class="brand__name">카페인 매니저</strong></div>
    <h1>로그인</h1>
    <p class="auth__lead">기록은 계정별로 저장됩니다. 처음이라면 아래에서 회원가입하세요.</p>
    <form class="auth__form" id="form" novalidate>
      <label class="field"><span class="field__label">이메일</span><input type="email" id="email" autocomplete="username" required placeholder="you@example.com"></label>
      <label class="field"><span class="field__label">비밀번호</span><input type="password" id="password" autocomplete="current-password" required placeholder="6자 이상"></label>
      <div class="form-error hidden" id="error"></div>
      <div class="form-ok hidden" id="ok"></div>
      <button type="submit" class="btn-green" id="submitBtn">로그인</button>
    </form>
    <p class="auth__foot">계정이 없나요? <a href="signup.html" id="signupLink">회원가입</a></p>
    <div class="auth__mode" id="modeNote"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/seed-products.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(async function () {
  const CM = window.CM, ui = CM.ui, $ = (id) => document.getElementById(id);
  // record.html?product=... 처럼 쿼리가 붙은 주소도 허용한다(같은 폴더의 .html 만, 외부 이동 불가).
  const next = ui.qs("next") && /^[\w-]+\.html(\?[\w=%.\-~+&]*)?$/.test(ui.qs("next")) ? ui.qs("next") : "index.html";
  $("signupLink").href = "signup.html?next=" + encodeURIComponent(next);
  $("modeNote").innerHTML = CM.mode === "supabase" ? "클라우드 모드 · Supabase 인증" : "로컬 모드 · 계정과 기록이 <b>이 브라우저에만</b> 저장됩니다. (js/config.js 에 Supabase 키를 넣으면 클라우드 모드)";
  if (ui.qs("confirmed")) { $("ok").textContent = "이메일 확인이 끝났습니다. 로그인해 주세요."; $("ok").classList.remove("hidden"); }
  if (ui.qs("disabled")) { $("error").textContent = "비활성화된 계정입니다. 관리자에게 문의하세요."; $("error").classList.remove("hidden"); }
  const notice = CM.takeAuthNotice && CM.takeAuthNotice();
  if (notice) { $("error").textContent = notice; $("error").classList.remove("hidden"); }
  await CM.auth.ready;
  if (CM.auth.getUser()) { location.replace(next); return; }
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("error"); err.classList.add("hidden");
    $("submitBtn").disabled = true; $("submitBtn").textContent = "확인 중…";
    try { await CM.auth.signIn({ email: $("email").value, password: $("password").value }); location.replace(next); }
    catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); $("submitBtn").disabled = false; $("submitBtn").textContent = "로그인"; }
  });
  $("email").focus();
})();
</script>
</body>
</html>
